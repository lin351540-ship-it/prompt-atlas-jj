name: Sync public prompt sources

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: prompt-source-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch licensed source snapshots
        run: |
          mkdir -p ../prompt-gallery-sources
          git clone --depth 1 https://github.com/ToseaAI/awesome-gpt-image-2-prompts.git ../prompt-gallery-sources/tosea
          git clone --depth 1 https://github.com/ApiMartAI/best-gpt-image-2-prompts.git ../prompt-gallery-sources/apimart
          git clone --depth 1 https://github.com/2slides/awesome-nano-banana-ppt-prompts.git ../prompt-gallery-sources/ppt-2slides

      - name: Refresh licensed gallery and public index
        run: |
          node scripts/import-curated-prompts.mjs
          node scripts/sync-public-index.mjs
          node scripts/sync-youmind-search-index.mjs

      - name: Verify and export
        run: |
          npm test
          node scripts/export-static.mjs

      - name: Commit refreshed snapshot
        run: |
          git config user.name "prompt-atlas-sync[bot]"
          git config user.email "prompt-atlas-sync[bot]@users.noreply.github.com"
          git add app/data public/gallery public/data docs
          if git diff --cached --quiet; then
            echo "No source changes"
          else
            git commit -m "chore: refresh public prompt sources"
            git push
          fi
